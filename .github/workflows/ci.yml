## A basic GitHub Actions workflow for your Quarkus application.

name: CI build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Mandrel 25
        run: |
          wget -O $RUNNER_TEMP/mandrel.tar.gz \
            https://github.com/graalvm/mandrel/releases/download/mandrel-25.0.3.0-Final/mandrel-java25-linux-amd64-25.0.3.0-Final.tar.gz

      - name: Set up JDK 25 (Mandrel)
        uses: actions/setup-java@v4
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/mandrel.tar.gz
          java-version: '25'
          architecture: x64
          cache: maven

      - name: Build
        run: ./mvnw verify -B
