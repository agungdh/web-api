## CI build + test + native + docker

name: CI build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven

      - name: Start services
        run: docker compose up -d --wait

      - name: Run tests (unit + integration)
        run: ./mvnw verify -DskipITs=false -B

      - name: Stop services
        if: always()
        run: docker compose down

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Mandrel 25
        run: |
          wget -O $RUNNER_TEMP/mandrel.tar.gz \
            https://github.com/graalvm/mandrel/releases/download/mandrel-25.0.3.0-Final/mandrel-java25-linux-amd64-25.0.3.0-Final.tar.gz

      - name: Set up JDK 25 (Mandrel)
        uses: actions/setup-java@v4
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/mandrel.tar.gz
          java-version: '25'
          architecture: x64
          cache: maven

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev libfreetype6-dev

      - name: Build
        run: ./mvnw verify -B -DskipTests

      - name: Build native image
        run: ./mvnw package -Dnative -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push distroless image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.native-distroless
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/web-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/web-api:${{ github.sha }}
