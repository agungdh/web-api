quarkus:
  datasource:
    db-kind: postgresql
    username: admin
    password: admin
    jdbc:
      url: jdbc:postgresql://localhost:5432/webapi
  hibernate-orm:
    unsupported-properties:
      "hibernate.id.db_structure_naming_strategy": legacy
  native:
    additional-build-args: -march=x86-64-v2
  swagger-ui:
    always-include: true
  flyway:
    migrate-at-start: false
    locations: classpath:db/migration
